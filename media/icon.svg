<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/><stop offset="0.45" stop-color="#d9a233"/><stop offset="1" stop-color="#7a4f0e"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#5a3fd0"/><stop offset="0.45" stop-color="#2a1b78"/><stop offset="1" stop-color="#0b0820"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffd257" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd257" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fff2bf"/><stop offset="1" stop-color="#ffc533"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f1ff"/><stop offset="1" stop-color="#5cc3ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="inner"><rect x="22" y="22" width="468" height="468" rx="78"/></clipPath>
  </defs>

  <rect x="4" y="4" width="504" height="504" rx="96" fill="#090616"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="url(#rim)"/>
  <rect x="22" y="22" width="468" height="468" rx="78" fill="url(#bg)"/>

  <g clip-path="url(#inner)">
    <!-- light from above -->
    <rect x="22" y="22" width="468" height="230" fill="url(#top)"/>
    <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

    <!-- sound waves -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round" filter="url(#glow)">
      <path d="M399.3 155.6 A175 175 0 0 1 399.3 356.4" stroke-width="26"/>
      <path d="M112.7 155.6 A175 175 0 0 0 112.7 356.4" stroke-width="26"/>
      <path d="M448.3 145 A222 222 0 0 1 448.3 367" stroke-width="20" opacity="0.6"/>
      <path d="M63.7 145 A222 222 0 0 0 63.7 367" stroke-width="20" opacity="0.6"/>
    </g>

    <!-- cleansing spark -->
    <g filter="url(#glow)">
      <path d="M256 84 Q274 238 364 256 Q274 274 256 428 Q238 274 148 256 Q238 238 256 84 Z" fill="url(#star)"/>
    </g>
    <path d="M256 150 Q263 249 310 256 Q263 263 256 362 Q249 263 202 256 Q249 249 256 150 Z" fill="#ffffff" opacity="0.9"/>
    <!-- small sparks -->
    <path d="M372 96 Q376 124 398 128 Q376 132 372 160 Q368 132 346 128 Q368 124 372 96 Z" fill="#fff6d6" filter="url(#glow)"/>
    <path d="M142 362 Q145 382 160 385 Q145 388 142 408 Q139 388 124 385 Q139 382 142 362 Z" fill="#fff6d6" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- inner edge -->
  <rect x="22" y="22" width="468" height="468" rx="78" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="5"/>
  <rect x="27" y="27" width="458" height="458" rx="74" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
